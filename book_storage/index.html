<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thư viện </title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-content">
      <h1>Thư viện Ping Ming</h1>
      <span class="favorite-count">Yêu thích: <strong id="fav-count">0</strong></span>
      <button type="button" id="theme-toggle" class="btn-theme" aria-label="Chuyển chế độ sáng tối">🌙 Chế độ tối</button>
    </div>
  </header>

  <main class="container">
    <section class="toolbar" aria-labelledby="toolbar-title">
      <h2 id="toolbar-title">Tìm kiếm sách</h2>
      <div class="toolbar-controls">
        <label for="search-input" class="sr-only">Tìm theo tên sách</label>
        <input type="text" id="search-input" placeholder="Tìm theo tên sách...">

        <label for="genre-filter" class="sr-only">Chọn thể loại</label>
        <select id="genre-filter">
          <option value="all">Tất cả thể loại</option>
        </select>
      </div>
      <p id="status-text">Đang hiển thị 0 / 0 cuốn</p>
    </section>

    <section class="book-section" aria-labelledby="book-list-title">
      <div class="section-heading">
        <h2 id="book-list-title">Danh sách sách</h2>
        <div id="loading-state" class="state-message" hidden>Đang tải...</div>
      </div>

      <div id="book-grid" class="book-grid"></div>
    </section>

    <section class="form-section" aria-labelledby="form-title">
      <h2 id="form-title">Thêm sách mới</h2>
      <form id="add-book-form">
        <div class="form-group">
          <label for="book-name">Tên sách</label>
          <input type="text" id="book-name" name="name" placeholder="Nhập tên sách">
          <span class="error-msg" id="name-error"></span>
        </div>

        <div class="form-group">
          <label for="book-author">Tác giả</label>
          <input type="text" id="book-author" name="author" placeholder="Nhập tên tác giả">
          <span class="error-msg" id="author-error"></span>
        </div>

        <div class="form-group">
          <label for="book-genre">Thể loại</label>
          <select id="book-genre" name="genre">
            <option value="">Chọn thể loại</option>
          </select>
          <span class="error-msg" id="genre-error"></span>
        </div>

        <div class="form-group">
          <label for="book-year">Năm xuất bản</label>
          <input type="number" id="book-year" name="year" placeholder="Ví dụ: 2026" min="1" max="2100">
          <span class="error-msg" id="year-error"></span>
        </div>

        <button type="submit" class="btn-submit">Thêm sách</button>
      </form>
    </section>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
